name: OTA Publish (manual)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "OTA channel"
        required: true
        default: "stable"
      version:
        description: "OTA version"
        required: true
        default: "0.2.0"
      publish:
        description: "Publish OTA assets to current repo"
        required: true
        default: "false"
      build_tauri_release:
        description: "Build example Tauri binaries and draft release"
        required: true
        default: "false"

jobs:
  build-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build JS API package
        run: pnpm run build:api
      - name: Install example dependencies
        run: pnpm install --frozen-lockfile=false
        working-directory: examples/tauri-app
      - name: Build example frontend
        run: pnpm run build
        working-directory: examples/tauri-app
      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-dist
          path: examples/tauri-app/dist

  build-example-tauri-release:
    if: github.event.inputs.build_tauri_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-2022
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: examples/tauri-app/src-tauri -> target
          shared-key: tauri-app-${{ matrix.platform }}-${{ matrix.args }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build JS API package
        run: pnpm run build:api
      - name: Install example dependencies
        run: pnpm install --frozen-lockfile=false
        working-directory: examples/tauri-app
      - name: Build and publish Tauri app release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: examples/tauri-app
          tagName: v${{ github.event.inputs.version }}
          releaseName: Example Tauri app v${{ github.event.inputs.version }}
          releaseBody: |
            Example app build for OTA verification.
            Use these binaries to install v${{ github.event.inputs.version }} and test OTA upgrade flow.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeDebug: false
          includeRelease: true

  publish-example-to-current-repo:
    runs-on: ubuntu-latest
    needs: [build-example]
    if: github.event.inputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-app-dist
          path: dist
      - name: Publish example OTA assets to current repo
        uses: s00d/tauri-plugin-ota-self-update@v0.2.0
        with:
          mode: github
          channel: ${{ github.event.inputs.channel }}
          version: ${{ github.event.inputs.version }}
          dist_dir: dist
          out_dir: .ota-out
          target_repo: ${{ github.repository }}
          release_tag: ota-${{ github.event.inputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_url: https://updates.example.com/ota
