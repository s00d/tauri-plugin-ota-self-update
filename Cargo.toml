[package]
name = "tauri-plugin-ota-self-update"
version = "0.2.0"
authors = ["s00d"]
description = "Self-hosted OTA updates for Tauri v2 web assets."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ota-self-update"
license = "MIT OR Apache-2.0"
repository = "https://github.com/s00d/tauri-plugin-ota-self-update"

[dependencies]
tauri = { version = "2.11.2" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
minisign-verify = "0.2"
url = "2.5"
flate2 = "1.0"
tar = "0.4"
semver = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }
